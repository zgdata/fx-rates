name: FX rates (hourly, per-country local mornings)

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 UTC; schedule_config.json decides which countries are due
  workflow_dispatch:        # manual run = fetch every country + global now

permissions:
  contents: write

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get Cloudflare Worker box sources (VietinBank, ABA, BoC) and merge with box_sources.json
        continue-on-error: true
        run: |
          if curl -fsS -m 30 -o /tmp/cf_sources.json https://fx-box-sources.stjepan-20b.workers.dev/box_sources.json; then
            echo "got Cloudflare box_sources.json"
          else
            echo "Cloudflare Worker fetch failed - using committed box_sources.json only"; echo '{"sources":{}}' > /tmp/cf_sources.json
          fi
          python scripts/merge_cf.py box_sources.json /tmp/cf_sources.json /tmp/box_merged.json || cp box_sources.json /tmp/box_merged.json

      - name: Fetch due countries
        id: fetch
        env:
          BOT_TH_TOKEN: ${{ secrets.BOT_TH_TOKEN }}
        # Erste/OTP stay disabled (no FX_ENABLE_ERSTE / FX_OTP_BROWSER_UA)
        run: |
          BOX=box_sources.json; [ -s /tmp/box_merged.json ] && BOX=/tmp/box_merged.json
          python fetch_rates.py --box-out "$BOX" ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}

      - name: Commit (only if a country was checked or data changed)
        id: commit
        run: |
          git config user.name  "fx-rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          due="${{ steps.fetch.outputs.due }}"
          if python scripts/changed.py rates.json; then kind="rates"; elif [ -n "$due" ]; then kind="heartbeat"; else kind=""; fi
          if [ -z "$kind" ]; then
            echo "Nothing due and no data change - discarding timestamp-only changes."
            git checkout -- rates.json rates/
            exit 0
          fi
          git add rates.json rates/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "$kind: $(date -u +%Y-%m-%dT%H:%MZ) [${due:-box merge}]"
          git diff --name-only HEAD~1 HEAD -- rates.json rates/ | tr '\n' ' ' > /tmp/changed_files
          for i in 1 2 3; do
            git push -q && break
            echo "push failed (box may have pushed), rebasing, retry $i"; sleep 5; git pull --rebase -q
          done
          echo "files=$(cat /tmp/changed_files)" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache for changed files (best effort)
        if: steps.commit.outputs.files != ''
        continue-on-error: true
        run: |
          for f in ${{ steps.commit.outputs.files }}; do
            curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" >/dev/null && echo "purged $f" || echo "purge failed: $f"
          done
