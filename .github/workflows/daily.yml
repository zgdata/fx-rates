name: Daily FX rates

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily (07:17 Zagreb summer / 06:17 winter, 12:17 Hanoi)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch rates
        run: python fetch_rates.py   # Erste/OTP stay disabled (no FX_ENABLE_ERSTE / FX_OTP_BROWSER_UA)

      - name: Commit rates (daily; heartbeat commit even if only timestamps changed)
        run: |
          git config user.name  "fx-rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python scripts/changed.py rates.json; then kind="rates"; else kind="heartbeat"; fi
          git add rates.json rates/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "$kind: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Purge jsDelivr cache (best effort)
        continue-on-error: true
        run: |
          for f in rates.json rates/index.json rates/global.json; do
            curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" >/dev/null && echo "purged $f" || echo "purge failed: $f"
          done
