name: Daily FX rates

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily (07:17 Zagreb summer / 06:17 winter, 12:17 Hanoi)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch rates
        run: python fetch_rates.py   # Erste/OTP stay disabled (no FX_ENABLE_ERSTE / FX_OTP_BROWSER_UA)

      - name: Commit rates.json if content changed
        run: |
          if python scripts/changed.py rates.json; then
            git config user.name  "fx-rates-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "rates: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No rate changes (only timestamps) - nothing committed."
          fi
